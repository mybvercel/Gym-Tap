<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión</title>
    <style>
      /* Sin dependencias: esta página tiene que existir cuando no hay red. */
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        background: #0d1117;
        color: #eef2f6;
        font-family: system-ui, sans-serif;
      }
      p { margin: 0; max-width: 24rem; }
      .titulo { font-size: 1.5rem; font-weight: 700; }
      .suave { color: #a6b2be; font-size: 0.9375rem; }
    </style>
  </head>
  <body>
    <p class="titulo">Todavía no tenemos esta ficha guardada</p>
    <p class="suave">
      Salí un momento a donde haya señal y volvé a apoyar el teléfono. Después
      de la primera vez queda disponible sin conexión.
    </p>
  </body>
</html>
